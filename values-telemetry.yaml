# 三信号实际处理配置；Helm 安装通过 -f values-telemetry.yaml 加载。
# 各集群差异只覆盖自己的 values-<cluster>.local.yaml；列表覆盖时需保留整份列表。
# Logs: 容器解析 → 按来源可选堆栈合并 → API 元数据 → opt-in → 归一化 → Kafka。
# Traces: 内存限制 → API 元数据 → 集群/自定义资源 → 可选降噪 → 归一化/脱敏 → 后端。
# Metrics: host/kubelet/cluster/Prometheus/SDK → Gateway 白名单标签 → 后端。
# memory_limiter、GOMEMLIMIT、持久队列、后端及实际 pipeline 由 chart 联动生成。
# cloud.provider/cloud.region 等可在本集群 resource_attributes map 中设置，不使用公司私有字段。
# 附加资源属性：所有信号统一应用；cluster/environment 仍由平台必填参数决定。
resource_attributes: {}

# 默认保留采样后的 spans；drop_noise=true 才启用下方精确路由降噪。
# 只过滤非错误的 SERVER 健康检查 span，可能造成 trace 缺段；不按任意 URL/静态后缀全局丢弃。
# SDK always_on；独立采样器按 traceID 聚合，策略见下方 tail_sampling。
trace_processing:
  drop_noise: false
  noise_filter:
    error_mode: ignore
    traces:
      span:
      - kind == SPAN_KIND_SERVER and status.code != STATUS_CODE_ERROR and (attributes["http.response.status_code"] == nil or attributes["http.response.status_code"]
        < 400) and (attributes["http.status_code"] == nil or attributes["http.status_code"] < 400) and (attributes["http.route"] == "/health" or attributes["http.route"]
        == "/healthz" or attributes["http.route"] == "/readyz" or attributes["http.route"] == "/livez" or attributes["http.route"] == "/actuator/health")
  redact:
    actions:
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: db.statement
      action: delete
    - key: db.query.text
      action: delete
    # 完整URL/旧版target可能含凭据或敏感查询；保留独立url.path/http.route用于定位。
    - key: url.full
      action: delete
    - key: url.query
      action: delete
    - key: url.fragment
      action: delete
    - key: http.url
      action: delete
    - key: http.target
      action: delete
    - key: http.request.body
      action: delete
    - key: http.response.body
      action: delete
  normalize:
    error_mode: ignore
    trace_statements:
    - context: resource
      statements:
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"]
        != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")

# 接收器与输出标签的实际配置。节点 usage 和集群 request/limit 配合查询。
# 不复制全部 resource 为 Prometheus labels；不要删除指标自身实例/维度。
metrics_processing:
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.limit:
            enabled: true
      load: {}
      disk: {}
      network: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_mount_points:
          match_type: regexp
          mount_points:
          - /dev/.*
          - /proc/.*
          - /sys/.*
          - /var/lib/kubelet/.*
          - /run/containerd/.*
          - /run/k3s/containerd/.*
          - /var/lib/docker/.*
          - /snap/.*
        exclude_fs_types:
          match_type: strict
          fs_types:
          - autofs
          - binfmt_misc
          - bpf
          - cgroup
          - cgroup2
          - configfs
          - debugfs
          - devpts
          - devtmpfs
          - fusectl
          - hugetlbfs
          - iso9660
          - mqueue
          - nsfs
          - overlay
          - proc
          - procfs
          - pstore
          - rpc_pipefs
          - securityfs
          - selinuxfs
          - squashfs
          - sysfs
          - tracefs
  kubeletstats:
    auth_type: serviceAccount
    endpoint: https://${env:OTEL_NODE_IP}:10250
    collection_interval: 30s
    insecure_skip_verify: false
    metric_groups:
    - pod
    - container
    - volume
  cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - NetworkUnavailable
    allocatable_types_to_report:
    - cpu
    - memory
    - storage
  labels:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"]
        != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"])
        where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")
    - context: datapoint
      statements:
      - set(attributes["k8s_cluster_name"], resource.attributes["k8s.cluster.name"])
        where resource.attributes["k8s.cluster.name"] != nil and attributes["k8s_cluster_name"]
        == nil
      - set(attributes["deployment_environment_name"], resource.attributes["deployment.environment.name"])
        where resource.attributes["deployment.environment.name"] != nil and attributes["deployment_environment_name"]
        == nil
      - set(attributes["k8s_namespace_name"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["k8s.namespace.name"] != nil and attributes["k8s_namespace_name"]
        == nil
      - set(attributes["k8s_pod_name"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"]
        != nil and attributes["k8s_pod_name"] == nil
      - set(attributes["k8s_node_name"], resource.attributes["k8s.node.name"]) where
        resource.attributes["k8s.node.name"] != nil and attributes["k8s_node_name"]
        == nil
      - set(attributes["service_name"], resource.attributes["service.name"]) where resource.attributes["service.name"]
        != nil and attributes["service_name"] == nil
      - set(attributes["service_namespace"], resource.attributes["service.namespace"])
        where resource.attributes["service.namespace"] != nil and attributes["service_namespace"]
        == nil
      - set(attributes["k8s_container_name"], resource.attributes["k8s.container.name"])
        where resource.attributes["k8s.container.name"] != nil and attributes["k8s_container_name"]
        == nil
      - set(attributes["k8s_volume_name"], resource.attributes["k8s.volume.name"]) where
        resource.attributes["k8s.volume.name"] != nil and attributes["k8s_volume_name"]
        == nil
      - set(attributes["k8s_daemonset_name"], resource.attributes["k8s.daemonset.name"])
        where resource.attributes["k8s.daemonset.name"] != nil and attributes["k8s_daemonset_name"]
        == nil
      - set(attributes["k8s_statefulset_name"], resource.attributes["k8s.statefulset.name"])
        where resource.attributes["k8s.statefulset.name"] != nil and attributes["k8s_statefulset_name"]
        == nil
      - set(attributes["k8s_replicaset_name"], resource.attributes["k8s.replicaset.name"])
        where resource.attributes["k8s.replicaset.name"] != nil and attributes["k8s_replicaset_name"]
        == nil
      - set(attributes["k8s_job_name"], resource.attributes["k8s.job.name"]) where resource.attributes["k8s.job.name"]
        != nil and attributes["k8s_job_name"] == nil
      - set(attributes["k8s_cronjob_name"], resource.attributes["k8s.cronjob.name"])
        where resource.attributes["k8s.cronjob.name"] != nil and attributes["k8s_cronjob_name"]
        == nil
      - set(attributes["k8s_hpa_name"], resource.attributes["k8s.hpa.name"]) where resource.attributes["k8s.hpa.name"]
        != nil and attributes["k8s_hpa_name"] == nil
log_processing:
  filelog:
    container:
      id: container-parser
      type: container
      add_metadata_from_filepath: true
      max_log_size: 256KiB
    source:
      id: separate-container-stream
      type: add
      field: attributes["otel.log.source"]
      value: EXPR(attributes["log.file.path"] + ":" + attributes["log.iostream"])
    recombine:
      id: application-stack
      type: recombine
      if: 'false'
      combine_field: body
      combine_with: '

        '
      is_first_entry: body matches "^[[]?[0-9]{4}[-/][0-9]{2}[-/][0-9]{2}[ T]"
      source_identifier: attributes["otel.log.source"]
      max_sources: 128
      max_log_size: 262144
      max_batch_size: 128
      max_unmatched_batch_size: 1
      force_flush_period: 1s
      overwrite_with: oldest
    cleanup:
      id: remove-internal-source
      type: remove
      field: attributes["otel.log.source"]
  kubernetes:
    auth_type: serviceAccount
    passthrough: false
    wait_for_metadata: true
    wait_for_metadata_timeout: 30s
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.node.name
      - k8s.deployment.name
      - k8s.container.name
      - container.image.name
      - container.image.tags
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.job.name
      - k8s.cronjob.name
      labels:
      - from: pod
        key: app.kubernetes.io/name
        tag_name: service.name
      - from: pod
        key: app.kubernetes.io/version
        tag_name: service.version
      - from: pod
        key: observability.example.com/enabled
        tag_name: obs.pod.enabled
      - from: namespace
        key: observability.example.com/enabled
        tag_name: obs.namespace.enabled
      annotations:
      - from: pod
        key: instrumentation.opentelemetry.io/inject-java
        tag_name: obs.pod.inject.java
      - from: pod
        key: instrumentation.opentelemetry.io/inject-python
        tag_name: obs.pod.inject.python
      - from: pod
        key: instrumentation.opentelemetry.io/inject-nodejs
        tag_name: obs.pod.inject.nodejs
      - from: pod
        key: instrumentation.opentelemetry.io/inject-sdk
        tag_name: obs.pod.inject.sdk
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-java
        tag_name: obs.namespace.inject.java
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-python
        tag_name: obs.namespace.inject.python
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-nodejs
        tag_name: obs.namespace.inject.nodejs
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-sdk
        tag_name: obs.namespace.inject.sdk
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    filter:
      node_from_env_var: OTEL_NODE_NAME
  resource:
    attributes:
    - key: k8s.cluster.name
      value: ''
      action: upsert
    - key: deployment.environment.name
      value: ''
      action: upsert
    - key: k8s.node.name
      value: ${env:OTEL_NODE_NAME}
      action: upsert
    - key: host.name
      value: ${env:OTEL_NODE_NAME}
      action: upsert
  normalize:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - set(cache["json"], body) where IsMap(body)
      - set(cache["json"], ParseJSON(body)) where IsString(body) and IsMatch(body, "^[[:space:]]*[{]")
      - set(cache["trace"], cache["json"]["trace_id"]) where cache["trace"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["trace_id"])
      - set(cache["trace"], cache["json"]["traceId"]) where cache["trace"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["traceId"])
      - set(cache["trace"], cache["json"]["otelTraceID"]) where cache["trace"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["otelTraceID"])
      - set(cache["trace"], cache["json"]["trace.id"]) where cache["trace"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["trace.id"])
      - set(cache["trace"], cache["json"]["trace"]["id"]) where cache["trace"] == nil and IsMap(cache["json"]) and IsMap(cache["json"]["trace"]) and IsString(cache["json"]["trace"]["id"])
      - set(cache["span"], cache["json"]["span_id"]) where cache["span"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["span_id"])
      - set(cache["span"], cache["json"]["spanId"]) where cache["span"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["spanId"])
      - set(cache["span"], cache["json"]["otelSpanID"]) where cache["span"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["otelSpanID"])
      - set(cache["span"], cache["json"]["span.id"]) where cache["span"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["span.id"])
      - set(cache["span"], cache["json"]["span"]["id"]) where cache["span"] == nil and IsMap(cache["json"]) and IsMap(cache["json"]["span"]) and IsString(cache["json"]["span"]["id"])
      - set(cache["text_trace"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])(?:trace_id|traceId|otelTraceID)[[:space:]]*[=:][[:space:]\"\\x27]*(?P<trace_id>[0-9a-f]{32})(?:$|[^0-9a-f])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["text_span"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])(?:span_id|spanId|otelSpanID)[[:space:]]*[=:][[:space:]\"\\x27]*(?P<span_id>[0-9a-f]{16})(?:$|[^0-9a-f])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["traceparent"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])traceparent[[:space:]]*[=:][[:space:]\"\\x27]*00-(?P<trace_id>[0-9a-f]{32})-(?P<span_id>[0-9a-f]{16})-[0-9a-f]{2}(?:$|[^0-9a-f-])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["bracket"], ExtractPatterns(body, "\\[(?P<trace_id>[0-9a-fA-F]{32})[[:space:]]*,[[:space:]]*(?P<span_id>[0-9a-fA-F]{16})\\]")) where IsString(body)
        and not IsMap(cache["json"])
      - set(cache["trace"], cache["bracket"]["trace_id"]) where cache["trace"] == nil and IsMap(cache["bracket"]) and IsString(cache["bracket"]["trace_id"])
      - set(cache["span"], cache["bracket"]["span_id"]) where cache["span"] == nil and IsMap(cache["bracket"]) and IsString(cache["bracket"]["span_id"])
      - set(cache["trace"], cache["text_trace"]["trace_id"]) where cache["trace"] == nil and IsMap(cache["text_trace"]) and IsString(cache["text_trace"]["trace_id"])
      - set(cache["trace"], cache["traceparent"]["trace_id"]) where cache["trace"] == nil and IsMap(cache["traceparent"]) and IsString(cache["traceparent"]["trace_id"])
      - set(cache["span"], cache["text_span"]["span_id"]) where cache["span"] == nil and IsMap(cache["text_span"]) and IsString(cache["text_span"]["span_id"])
      - set(cache["span"], cache["traceparent"]["span_id"]) where cache["span"] == nil and IsMap(cache["traceparent"]) and IsString(cache["traceparent"]["span_id"])
      - set(trace_id, TraceID(cache["trace"])) where IsString(cache["trace"]) and IsMatch(cache["trace"], "^[0-9a-fA-F]{32}$") and not IsMatch(cache["trace"], "^0+$")
      - set(span_id, SpanID(cache["span"])) where IsString(cache["span"]) and IsMatch(cache["span"], "^[0-9a-fA-F]{16}$") and not IsMatch(cache["span"], "^0+$")
      - set(cache["header"], ExtractPatterns(body, "^[[]?(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.,][0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})?)[\\]]?[[:space:]]*(?:[-|][[:space:]]*)?(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)\\b"))
        where IsString(body) and not IsMap(cache["json"])
      - set(severity_text, cache["header"]["level"]) where IsMap(cache["header"]) and IsString(cache["header"]["level"])
      - set(cache["application_time"], cache["json"]["timestamp"]) where IsMap(cache["json"]) and IsString(cache["json"]["timestamp"])
      - set(cache["application_time"], cache["json"]["@timestamp"]) where cache["application_time"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["@timestamp"])
      - set(cache["application_time"], cache["json"]["time"]) where cache["application_time"] == nil and IsMap(cache["json"]) and IsString(cache["json"]["time"])
      - set(time, Time(cache["application_time"], "%Y-%m-%dT%H:%M:%S.%sZ")) where IsString(cache["application_time"]) and IsMatch(cache["application_time"], "Z$")
      - set(time, Time(cache["application_time"], "%Y-%m-%dT%H:%M:%S.%s%j")) where IsString(cache["application_time"]) and IsMatch(cache["application_time"], "[+-][0-9]{2}:[0-9]{2}$")
      - set(severity_text, cache["json"]["level"]) where IsMap(cache["json"]) and IsString(cache["json"]["level"])
      - set(severity_text, cache["json"]["levelname"]) where severity_text == "" and IsMap(cache["json"]) and IsString(cache["json"]["levelname"])
      - set(severity_text, ToUpperCase(severity_text)) where severity_text != ""
      - set(severity_number, 1) where severity_text == "TRACE"
      - set(severity_number, 5) where severity_text == "DEBUG"
      - set(severity_number, 9) where severity_text == "INFO"
      - set(severity_number, 13) where severity_text == "WARN"
      - set(severity_number, 13) where severity_text == "WARNING"
      - set(severity_number, 17) where severity_text == "ERROR"
      - set(severity_number, 21) where severity_text == "FATAL"
      - set(severity_number, 21) where severity_text == "CRITICAL"
      - set(severity_number, 1) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 10
      - set(severity_text, "TRACE") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"]
        == 10
      - set(severity_number, 5) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 20
      - set(severity_text, "DEBUG") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"]
        == 20
      - set(severity_number, 9) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 30
      - set(severity_text, "INFO") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] ==
        30
      - set(severity_number, 13) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] ==
        40
      - set(severity_text, "WARN") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] ==
        40
      - set(severity_number, 17) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] ==
        50
      - set(severity_text, "ERROR") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"]
        == 50
      - set(severity_number, 21) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"] ==
        60
      - set(severity_text, "FATAL") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"]) or IsDouble(cache["json"]["level"])) and cache["json"]["level"]
        == 60
      - delete_key(cache["json"], "password") where IsMap(cache["json"])
      - delete_key(cache["json"], "authorization") where IsMap(cache["json"])
      - delete_key(cache["json"], "cookie") where IsMap(cache["json"])
      - set(body, cache["json"]) where IsMap(cache["json"])
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")
  application_time:
    enabled: false
    timezone: UTC
    layout: '%Y-%m-%d %H:%M:%S.%L'


# 尾采样：满足任一规则即保留。30s 从首个收到的 span 开始计时。
# 超大 trace、迟到 span、待决状态重启丢失等边界见架构文档。
# 上游 latency 使用严格 > 且按毫秒取整；1999 表示保留耗时至少 2000ms。
#
# 【2026-10-24 new-dev 压测实测，勿低于此配置】
# num_traces 是每个 sampler 副本的待决 trace 上限；填满速率为 num_traces/decision_wait，
# 超过后旧 trace 在决策前被逐出——不是渐变衰减而是断崖：749 traces/s（375/s/副本）时
# num_traces=10000 实测保留数为 0（errors/slow 全丢，且 refused/队列指标无任何异常，静默故障）。
# 容量公式：num_traces >= 1.5 x 集群 traces/s x decision_wait / sampler_replicas。
# 200 微服务按 20 QPS/服务 = 4000 traces/s：4000x30/2x1.5 = 90000；取 200000 后实测
# 5269 traces/s 健康（保留率与策略精确一致，sampler 内存 739Mi/4096Mi）。
# decision_cache 同数量级；内存估算约 1.5KB x 5 spans x 待决数，200k 上限约需 1.5GiB/副本。
tail_sampling:
  decision_wait: 30s
  num_traces: 200000
  expected_new_traces_per_sec: 0
  maximum_trace_size_bytes: 5242880
  decision_cache:
    sampled_cache_size: 300000
    non_sampled_cache_size: 300000
  policies:
  - name: errors
    type: status_code
    status_code:
      status_codes:
      - ERROR
  - name: slow
    type: latency
    latency:
      threshold_ms: 1999
  - name: baseline
    type: probabilistic
    probabilistic:
      sampling_percentage: 10
