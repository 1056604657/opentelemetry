{{- range $namespace := (.Values.target_allocator_secret_namespaces | uniq) -}}
{{- if ne $namespace $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Namespace }}-otel-targetallocator-secrets
  namespace: {{ $namespace }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Namespace }}-otel-targetallocator-secrets
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Namespace }}-otel-targetallocator-secrets
subjects:
  - kind: ServiceAccount
    name: otel-targetallocator
    namespace: {{ $.Release.Namespace }}
{{ end -}}
{{ end -}}
