{{- if .Values.credentials.create -}}
{{- range $kind := list "backends" "kafka" "trust" }}
{{- if or (ne $kind "kafka") (eq $.Values.logs_transport "kafka") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values.secret_names $kind }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
{{- $data := deepCopy (index $.Values.credentials $kind) -}}
{{- if and (eq $kind "trust") $.Values.operator_metrics.enabled -}}
  {{- $_ := set $data "operator-ca.crt" (include "otel.operatorCA" $) -}}
{{- end }}
{{ toYaml $data | indent 2 }}
{{ end -}}
{{ end -}}
{{- end -}}
