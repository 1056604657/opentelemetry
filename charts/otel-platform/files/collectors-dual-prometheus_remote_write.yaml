- apiVersion: opentelemetry.io/v1beta1
  kind: OpenTelemetryCollector
  metadata:
    name: otel-node
    namespace: RELEASE_NAMESPACE
    labels:
      observability.example.com/managed: 'true'
  spec:
    mode: daemonset
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2
    serviceAccount: otel-node
    upgradeStrategy: none
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        file_storage:
          directory: /var/lib/otel
          create_directory: true
          fsync: true
      receivers:
        filelog:
          include:
          - /var/log/pods/*/*/*.log
          exclude:
          - /var/log/pods/RELEASE_NAMESPACE_*/*/*.log
          include_file_path: true
          start_at: beginning
          storage: file_storage
          max_log_size: 256KiB
          max_concurrent_files: 64
          max_batches: 1
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0s
          operators: []
        kubeletstats: {}
        hostmetrics: {}
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 819
          spike_limit_mib: 163
        resource/cluster:
          attributes:
          - key: k8s.cluster.name
            value: prod-cluster-01
            action: upsert
          - key: deployment.environment.name
            value: production
            action: upsert
        filter/log_opt_in:
          error_mode: propagate
          logs:
            log_record:
            - resource.attributes["obs.pod.enabled"] == "false"
            - resource.attributes["obs.pod.enabled"] != "true" and resource.attributes["obs.namespace.enabled"] != "true" and not ((resource.attributes["obs.pod.inject.java"]
              != nil and resource.attributes["obs.pod.inject.java"] != "false" and resource.attributes["obs.pod.inject.java"] != "") or (resource.attributes["obs.pod.inject.java"]
              == nil and resource.attributes["obs.namespace.inject.java"] != nil and resource.attributes["obs.namespace.inject.java"] != "false"
              and resource.attributes["obs.namespace.inject.java"] != "") or (resource.attributes["obs.pod.inject.python"] != nil and resource.attributes["obs.pod.inject.python"]
              != "false" and resource.attributes["obs.pod.inject.python"] != "") or (resource.attributes["obs.pod.inject.python"] == nil and resource.attributes["obs.namespace.inject.python"]
              != nil and resource.attributes["obs.namespace.inject.python"] != "false" and resource.attributes["obs.namespace.inject.python"]
              != "") or (resource.attributes["obs.pod.inject.nodejs"] != nil and resource.attributes["obs.pod.inject.nodejs"] != "false" and resource.attributes["obs.pod.inject.nodejs"]
              != "") or (resource.attributes["obs.pod.inject.nodejs"] == nil and resource.attributes["obs.namespace.inject.nodejs"] != nil and
              resource.attributes["obs.namespace.inject.nodejs"] != "false" and resource.attributes["obs.namespace.inject.nodejs"] != "") or (resource.attributes["obs.pod.inject.sdk"]
              != nil and resource.attributes["obs.pod.inject.sdk"] != "false" and resource.attributes["obs.pod.inject.sdk"] != "") or (resource.attributes["obs.pod.inject.sdk"]
              == nil and resource.attributes["obs.namespace.inject.sdk"] != nil and resource.attributes["obs.namespace.inject.sdk"] != "false"
              and resource.attributes["obs.namespace.inject.sdk"] != ""))
      exporters:
        kafka:
          brokers:
          - kafka-0.invalid:9093
          - kafka-1.invalid:9093
          - kafka-2.invalid:9093
          protocol_version: 2.1.0
          tls:
            ca_file: /etc/otel/trust/kafka-ca.crt
            min_version: '1.2'
          auth:
            sasl:
              mechanism: SCRAM-SHA-512
              username: ${env:KAFKA_USERNAME}
              password: ${env:KAFKA_PASSWORD}
          logs:
            topic: otel.prod-cluster-01.logs.v1
            encoding: otlp_proto
          producer:
            required_acks: -1
            compression: zstd
            max_message_bytes: 4194304
            allow_auto_topic_creation: false
          partition_logs_by_resource_attributes: true
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            sizer: bytes
            queue_size: 268435456
            num_consumers: 1
            storage: file_storage
            block_on_overflow: true
        otlp/metrics:
          endpoint: http://otel-gateway-collector.RELEASE_NAMESPACE.svc:4317
          tls:
            insecure: true
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            sizer: bytes
            queue_size: 268435456
            num_consumers: 1
            storage: file_storage
            block_on_overflow: true
      service:
        extensions:
        - health_check
        - file_storage
        telemetry:
          logs:
            level: info
          metrics:
            level: normal
            readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        pipelines:
          logs:
            receivers:
            - filelog
            processors:
            - memory_limiter
            - k8s_attributes
            - filter/log_opt_in
            - resource/node
            - transform/log_json
            exporters:
            - kafka
          metrics:
            receivers:
            - kubeletstats
            - hostmetrics
            processors:
            - memory_limiter
            - resource/node
            exporters:
            - otlp/metrics
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 1024Mi
    env:
    - name: GOMEMLIMIT
      value: 656MiB
    - name: OTEL_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: OTEL_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    envFrom:
    - secretRef:
        name: otel-kafka
    volumes:
    - name: trust
      secret:
        secretName: otel-trust
    - name: logs
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: hostfs
      hostPath:
        path: /
        type: Directory
    - name: data
      hostPath:
        path: /var/lib/otel-node
        type: DirectoryOrCreate
    volumeMounts:
    - name: trust
      mountPath: /etc/otel/trust
      readOnly: true
    - name: logs
      mountPath: /var/log/pods
      readOnly: true
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
    - name: data
      mountPath: /var/lib/otel
      readOnly: false
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      runAsUser: 0
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 10001
    terminationGracePeriodSeconds: 120
    observability:
      metrics:
        enableMetrics: true
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - operator: Exists
    daemonSetUpdateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    livenessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
