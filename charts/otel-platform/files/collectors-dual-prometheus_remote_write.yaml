- apiVersion: opentelemetry.io/v1beta1
  kind: OpenTelemetryCollector
  metadata:
    name: otel-gateway
    namespace: RELEASE_NAMESPACE
    labels:
      observability.example.com/managed: 'true'
  spec:
    mode: statefulset
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2
    serviceAccount: otel-gateway
    upgradeStrategy: none
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        file_storage:
          directory: /var/lib/otel
          create_directory: true
          fsync: true
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              max_recv_msg_size_mib: 4
            http:
              endpoint: 0.0.0.0:4318
              max_request_body_size: 4194304
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 1638
          spike_limit_mib: 327
        resource/cluster:
          attributes:
          - key: k8s.cluster.name
            value: prod-cluster-01
            action: upsert
          - key: deployment.environment.name
            value: production
            action: upsert
        k8s_attributes:
          auth_type: serviceAccount
          passthrough: false
          wait_for_metadata: true
          wait_for_metadata_timeout: 30s
          extract:
            metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.container.name
            - container.image.name
            - container.image.tags
            labels:
            - from: pod
              key: app.kubernetes.io/name
              tag_name: service.name
            - from: pod
              key: app.kubernetes.io/version
              tag_name: service.version
            - from: pod
              key: observability.example.com/enabled
              tag_name: obs.pod.enabled
            - from: namespace
              key: observability.example.com/enabled
              tag_name: obs.namespace.enabled
          pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.uid
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
      exporters:
        otlp_http/traces:
          endpoint: https://traces.invalid:4318
          compression: gzip
          timeout: 30s
          tls:
            ca_file: /etc/otel/trust/backend-ca.crt
            min_version: '1.2'
          headers:
            Authorization: ${env:TRACES_AUTHORIZATION}
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            sizer: bytes
            queue_size: 268435456
            num_consumers: 1
            storage: file_storage
            block_on_overflow: true
        prometheus_remote_write:
          http:
            endpoint: https://metrics.invalid/api/v1/otlp
            tls:
              ca_file: /etc/otel/trust/backend-ca.crt
              min_version: '1.2'
            headers:
              Authorization: ${env:METRICS_AUTHORIZATION}
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          remote_write_queue:
            enabled: true
            queue_size: 1000
            num_consumers: 1
          max_batch_size_bytes: 1048576
          max_batch_request_parallelism: 1
          wal:
            directory: /var/lib/otel/prw
            buffer_size: 100
            truncate_frequency: 1m
          resource_to_telemetry_conversion:
            enabled: false
      service:
        extensions:
        - health_check
        - file_storage
        telemetry:
          logs:
            level: info
          metrics:
            level: normal
            readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        pipelines:
          traces:
            receivers:
            - otlp
            processors:
            - memory_limiter
            - k8s_attributes
            - resource/cluster
            - attributes/redact
            exporters:
            - otlp_http/traces
          metrics:
            receivers:
            - otlp
            processors:
            - memory_limiter
            - k8s_attributes
            - resource/cluster
            - transform/metric_labels
            exporters:
            - prometheus_remote_write
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: '2'
        memory: 2048Mi
    env:
    - name: GOMEMLIMIT
      value: 1311MiB
    - name: OTEL_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: OTEL_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    envFrom:
    - secretRef:
        name: otel-backends
    volumes:
    - name: trust
      secret:
        secretName: otel-trust
    volumeMounts:
    - name: trust
      mountPath: /etc/otel/trust
      readOnly: true
    - name: data
      mountPath: /var/lib/otel
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      runAsUser: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 10001
    terminationGracePeriodSeconds: 120
    observability:
      metrics:
        enableMetrics: true
    replicas: 2
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: otel-gateway-collector
    volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: REPLACE_ME
        resources:
          requests:
            storage: 10Gi
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    livenessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
