    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: '2'
        memory: 2048Mi
    env:
    - name: GOMEMLIMIT
      value: 1311MiB
    - name: OTEL_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: OTEL_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    envFrom:
    - secretRef:
        name: otel-backends
    - secretRef:
        name: otel-kafka
    volumes:
    - name: trust
      secret:
        secretName: otel-trust
    volumeMounts:
    - name: trust
      mountPath: /etc/otel/trust
      readOnly: true
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      runAsUser: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 10001
    terminationGracePeriodSeconds: 120
    observability:
      metrics:
        enableMetrics: true
    replicas: 2
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: otel-logs-collector
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 2
