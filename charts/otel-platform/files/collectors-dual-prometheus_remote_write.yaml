      receivers:
        prometheus:
          target_allocator:
            endpoint: http://otel-scraper-targetallocator.RELEASE_NAMESPACE.svc:80
            interval: 30s
            collector_id: ${env:OTEL_POD_NAME}
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 1638
          spike_limit_mib: 327
        resource/cluster:
          attributes:
          - key: k8s.cluster.name
            value: prod-cluster-01
            action: upsert
          - key: deployment.environment.name
            value: production
            action: upsert
      exporters:
        otlp/metrics:
          endpoint: http://otel-gateway-collector.RELEASE_NAMESPACE.svc:4317
          tls:
            insecure: true
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            sizer: bytes
            queue_size: 268435456
            num_consumers: 1
            storage: file_storage
            block_on_overflow: true
      service:
        extensions:
        - health_check
        - file_storage
        telemetry:
          logs:
            level: info
          metrics:
            level: normal
            readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        pipelines:
          metrics:
            receivers:
            - prometheus
            processors:
            - memory_limiter
            - resource/cluster
            exporters:
            - otlp/metrics
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: '2'
        memory: 2048Mi
    env:
    - name: GOMEMLIMIT
      value: 1311MiB
    - name: OTEL_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: OTEL_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    envFrom: []
    volumes:
    - name: trust
      secret:
        secretName: otel-trust
    volumeMounts:
    - name: trust
      mountPath: /etc/otel/trust
      readOnly: true
    - name: data
      mountPath: /var/lib/otel
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      runAsUser: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 10001
    terminationGracePeriodSeconds: 120
    observability:
      metrics:
        enableMetrics: true
    replicas: 2
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: otel-scraper-collector
    volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: REPLACE_ME
        resources:
          requests:
            storage: 10Gi
    targetAllocator:
      enabled: true
      replicas: 1
      image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.161.0
      serviceAccount: otel-targetallocator
      allocationStrategy: consistent-hashing
      filterStrategy: relabel-config
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      prometheusCR:
        enabled: true
        denyFSAccessThroughSMs: true
        serviceMonitorSelector:
          matchLabels:
            observability.example.com/owner: otel
        podMonitorSelector:
          matchLabels:
            observability.example.com/owner: otel
        probeSelector:
          matchLabels:
            observability.example.com/owner: otel
        scrapeConfigSelector:
          matchLabels:
            observability.example.com/owner: otel
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    livenessProbe:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
