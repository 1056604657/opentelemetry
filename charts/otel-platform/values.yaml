logs_transport: direct
# 日志导出并发与攒批（0.7.5 新增）。new-dev 实测：后端（nginx→logs-ingest→ES）
# 单请求延迟 ≈1.05ms/条 + 固定开销，并行约 4，总吞吐上限 ~3.8k 条/s；
# 8192/4=3,877、8192/8=3,553、16384/4=3,892 条/s——加并发只排队、加批量只加延迟，
# 均无法突破后端上限，故默认 8192/4。后端上限更高时按比例上调并发。
# log_batch_size: 0 关闭攒批。
log_export_consumers: 4
log_batch_size: 8192
log_batch_timeout: 1s
sampler_replicas: 2
monitor_resources_enabled: true
scrape_jobs: []
log_namespaces: []
node_state_directory: /var/lib/otel-node
aws_sigv4:
  enabled: false
  region: ''
  service: aps
# 上游 latency 使用严格 > 且按毫秒取整；1999 表示保留耗时至少 2000ms。
#
# 【2026-10-24 new-dev 压测实测，勿低于此配置】
# num_traces 是每个 sampler 副本的待决 trace 上限；填满速率为 num_traces/decision_wait，
# 超过后旧 trace 在决策前被逐出——不是渐变衰减而是断崖：749 traces/s（375/s/副本）时
# num_traces=10000 实测保留数为 0（errors/slow 全丢，且 refused/队列指标无任何异常，静默故障）。
# 容量公式：num_traces >= 1.5 x 集群 traces/s x decision_wait / sampler_replicas。
# 200 微服务按 20 QPS/服务 = 4000 traces/s：4000x30/2x1.5 = 90000；取 200000 后实测
# 6405 traces/s 健康（保留率与策略精确一致，sampler 内存 852Mi/4096Mi）。
# decision_cache 同数量级；内存估算约 1.5KB x 5 spans x 待决数，200k 上限约需 1.5GiB/副本。
# 本默认值与 values-telemetry.yaml 保持一致；生效值始终以 -f values-telemetry.yaml 为准。
# 0.7.6 默认等待 60s；4000 x 60 / 2 x 1.5 = 180000，现有 200000 条/副本满足数量预算。
# 上述历史吞吐验证使用 30s；60s 的 RSS 和实际峰值仍需验收，不承诺故障零丢失。
tail_sampling:
  decision_wait: 60s
  num_traces: 200000
  expected_new_traces_per_sec: 0
  maximum_trace_size_bytes: 5242880
  decision_cache:
    sampled_cache_size: 300000
    non_sampled_cache_size: 300000
  policies:
  - name: errors
    type: status_code
    status_code:
      status_codes:
      - ERROR
  - name: slow
    type: latency
    latency:
      threshold_ms: 1999
  - name: baseline
    type: probabilistic
    probabilistic:
      sampling_percentage: 10

service_account_annotations: {}
