cluster_name: REPLACE_ME
environment: production
storage_class: ''
# false: all Collectors use no PVC; OTLP/Kafka queues use memory and Node log checkpoints keep hostPath.
# true: persist exporter queues; set storage_class before a fresh install.
persistent_queue: false
collector_image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2
gateway_topology: unified
gateway_replicas: 2
log_gateway_replicas: 2
collector_memory_mib:
  gateway: 2048
  logs: 2048
  node: 1024
  cluster: 1024
  scraper: 2048
  sampler: 4096
trace_endpoint: https://traces.invalid:4318
log_endpoint: https://logs.invalid:4318
metrics_protocol: otlp_http
metrics_endpoint: https://metrics.invalid/api/v1/otlp
kafka_brokers:
- kafka-0.invalid:9093
- kafka-1.invalid:9093
- kafka-2.invalid:9093
kafka_topic: ''
kafka_group: ''
java_image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0-1
python_image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b1-2
nodejs_image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0-6
secret_names:
  backends: otel-backends
  kafka: otel-kafka
  trust: otel-trust
trace_protocol: otlp_http
log_protocol: otlp_http
backend_ca_file: ''
kafka_tls:
  min_version: '1.2'
kafka_auth:
  sasl:
    mechanism: SCRAM-SHA-512
    username: ${env:KAFKA_USERNAME}
    password: ${env:KAFKA_PASSWORD}
kubelet_ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
kubelet_endpoint: https://${env:OTEL_NODE_IP}:10250
image_pull_secrets: []
target_allocator_image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.161.0
target_allocator_memory_mib: 1024
target_allocator_secret_namespaces: []
scraper_replicas: 2
pvc_size: 10Gi
collector_cpu:
  gateway:
    request: 500m
    limit: '2'
  logs:
    request: 500m
    limit: '2'
  node:
    request: 200m
    limit: '2'
  cluster:
    request: 500m
    limit: '2'
  scraper:
    request: 500m
    limit: '2'
  sampler:
    request: 500m
    limit: '2'
otlp_namespace_selector: {}
monitor_namespace_selector: {}
businessPodMonitors: []
credentials:
  create: true
  backends:
    TRACES_AUTHORIZATION: ''
    METRICS_AUTHORIZATION: ''
    LOGS_AUTHORIZATION: ''
  kafka:
    KAFKA_USERNAME: REPLACE_ME
    KAFKA_PASSWORD: REPLACE_ME
  trust:
    backend-ca.crt: ''
    kafka-ca.crt: ''
    kubelet-ca.crt: ''
    operator-ca.crt: ''
target_allocator_mtls:
  enabled: false
rollout_revision: ''
exporter_queue_mib: 256
otlp_max_recv_mib: 4
filelog_max_log_size: 256KiB
filelog_start_at: beginning
exporter_batch_max_kib: 512
log_processing:
  filelog:
    container:
      id: container-parser
      type: container
      add_metadata_from_filepath: true
      max_log_size: 256KiB
    source:
      id: separate-container-stream
      type: add
      field: attributes["otel.log.source"]
      value: EXPR(attributes["log.file.path"] + ":" + attributes["log.iostream"])
    recombine:
      id: application-stack
      type: recombine
      if: 'false'
      combine_field: body
      combine_with: '

        '
      is_first_entry: body matches "^[[]?[0-9]{4}[-/][0-9]{2}[-/][0-9]{2}[ T]"
      source_identifier: attributes["otel.log.source"]
      max_sources: 128
      max_log_size: 262144
      max_batch_size: 128
      max_unmatched_batch_size: 1
      force_flush_period: 1s
      overwrite_with: oldest
    cleanup:
      id: remove-internal-source
      type: remove
      field: attributes["otel.log.source"]
  kubernetes:
    auth_type: serviceAccount
    passthrough: false
    wait_for_metadata: true
    wait_for_metadata_timeout: 30s
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.node.name
      - k8s.deployment.name
      - k8s.container.name
      - container.image.name
      - container.image.tags
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.job.name
      - k8s.cronjob.name
      labels:
      - from: pod
        key: app.kubernetes.io/name
        tag_name: service.name
      - from: pod
        key: app.kubernetes.io/version
        tag_name: service.version
      - from: pod
        key: observability.example.com/enabled
        tag_name: obs.pod.enabled
      - from: namespace
        key: observability.example.com/enabled
        tag_name: obs.namespace.enabled
      annotations:
      - from: pod
        key: instrumentation.opentelemetry.io/inject-java
        tag_name: obs.pod.inject.java
      - from: pod
        key: instrumentation.opentelemetry.io/inject-python
        tag_name: obs.pod.inject.python
      - from: pod
        key: instrumentation.opentelemetry.io/inject-nodejs
        tag_name: obs.pod.inject.nodejs
      - from: pod
        key: instrumentation.opentelemetry.io/inject-sdk
        tag_name: obs.pod.inject.sdk
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-java
        tag_name: obs.namespace.inject.java
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-python
        tag_name: obs.namespace.inject.python
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-nodejs
        tag_name: obs.namespace.inject.nodejs
      - from: namespace
        key: instrumentation.opentelemetry.io/inject-sdk
        tag_name: obs.namespace.inject.sdk
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    filter:
      node_from_env_var: OTEL_NODE_NAME
  resource:
    attributes:
    - key: k8s.cluster.name
      value: ''
      action: upsert
    - key: deployment.environment.name
      value: ''
      action: upsert
    - key: k8s.node.name
      value: ${env:OTEL_NODE_NAME}
      action: upsert
    - key: host.name
      value: ${env:OTEL_NODE_NAME}
      action: upsert
  normalize:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - set(cache["json"], body) where IsMap(body)
      - set(cache["json"], ParseJSON(body)) where IsString(body) and IsMatch(body,
        "^[[:space:]]*[{]")
      - set(cache["trace"], cache["json"]["trace_id"]) where cache["trace"] == nil
        and IsMap(cache["json"]) and IsString(cache["json"]["trace_id"])
      - set(cache["trace"], cache["json"]["traceId"]) where cache["trace"] == nil
        and IsMap(cache["json"]) and IsString(cache["json"]["traceId"])
      - set(cache["trace"], cache["json"]["otelTraceID"]) where cache["trace"] ==
        nil and IsMap(cache["json"]) and IsString(cache["json"]["otelTraceID"])
      - set(cache["trace"], cache["json"]["trace.id"]) where cache["trace"] == nil
        and IsMap(cache["json"]) and IsString(cache["json"]["trace.id"])
      - set(cache["trace"], cache["json"]["trace"]["id"]) where cache["trace"] ==
        nil and IsMap(cache["json"]) and IsMap(cache["json"]["trace"]) and IsString(cache["json"]["trace"]["id"])
      - set(cache["span"], cache["json"]["span_id"]) where cache["span"] == nil and
        IsMap(cache["json"]) and IsString(cache["json"]["span_id"])
      - set(cache["span"], cache["json"]["spanId"]) where cache["span"] == nil and
        IsMap(cache["json"]) and IsString(cache["json"]["spanId"])
      - set(cache["span"], cache["json"]["otelSpanID"]) where cache["span"] == nil
        and IsMap(cache["json"]) and IsString(cache["json"]["otelSpanID"])
      - set(cache["span"], cache["json"]["span.id"]) where cache["span"] == nil and
        IsMap(cache["json"]) and IsString(cache["json"]["span.id"])
      - set(cache["span"], cache["json"]["span"]["id"]) where cache["span"] == nil
        and IsMap(cache["json"]) and IsMap(cache["json"]["span"]) and IsString(cache["json"]["span"]["id"])
      - set(cache["text_trace"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])(?:trace_id|traceId|otelTraceID)[[:space:]]*[=:][[:space:]\"\\x27]*(?P<trace_id>[0-9a-f]{32})(?:$|[^0-9a-f])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["text_span"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])(?:span_id|spanId|otelSpanID)[[:space:]]*[=:][[:space:]\"\\x27]*(?P<span_id>[0-9a-f]{16})(?:$|[^0-9a-f])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["traceparent"], ExtractPatterns(body, "(?i)(?:^|[[:space:],;\\[])traceparent[[:space:]]*[=:][[:space:]\"\\x27]*00-(?P<trace_id>[0-9a-f]{32})-(?P<span_id>[0-9a-f]{16})-[0-9a-f]{2}(?:$|[^0-9a-f-])"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["bracket"], ExtractPatterns(body, "\\[(?P<trace_id>[0-9a-fA-F]{32})[[:space:]]*,[[:space:]]*(?P<span_id>[0-9a-fA-F]{16})\\]"))
        where IsString(body) and not IsMap(cache["json"])
      - set(cache["trace"], cache["bracket"]["trace_id"]) where cache["trace"] ==
        nil and IsMap(cache["bracket"]) and IsString(cache["bracket"]["trace_id"])
      - set(cache["span"], cache["bracket"]["span_id"]) where cache["span"] == nil
        and IsMap(cache["bracket"]) and IsString(cache["bracket"]["span_id"])
      - set(cache["trace"], cache["text_trace"]["trace_id"]) where cache["trace"]
        == nil and IsMap(cache["text_trace"]) and IsString(cache["text_trace"]["trace_id"])
      - set(cache["trace"], cache["traceparent"]["trace_id"]) where cache["trace"]
        == nil and IsMap(cache["traceparent"]) and IsString(cache["traceparent"]["trace_id"])
      - set(cache["span"], cache["text_span"]["span_id"]) where cache["span"] == nil
        and IsMap(cache["text_span"]) and IsString(cache["text_span"]["span_id"])
      - set(cache["span"], cache["traceparent"]["span_id"]) where cache["span"] ==
        nil and IsMap(cache["traceparent"]) and IsString(cache["traceparent"]["span_id"])
      - set(trace_id, TraceID(cache["trace"])) where IsString(cache["trace"]) and
        IsMatch(cache["trace"], "^[0-9a-fA-F]{32}$") and not IsMatch(cache["trace"],
        "^0+$")
      - set(span_id, SpanID(cache["span"])) where IsString(cache["span"]) and IsMatch(cache["span"],
        "^[0-9a-fA-F]{16}$") and not IsMatch(cache["span"], "^0+$")
      - set(cache["header"], ExtractPatterns(body, "^[[]?(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2}[
        T][0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.,][0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})?)[\\]]?[[:space:]]*(?:[-|][[:space:]]*)?(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)\\b"))
        where IsString(body) and not IsMap(cache["json"])
      - set(severity_text, cache["header"]["level"]) where IsMap(cache["header"])
        and IsString(cache["header"]["level"])
      - set(cache["application_time"], cache["json"]["timestamp"]) where IsMap(cache["json"])
        and IsString(cache["json"]["timestamp"])
      - set(cache["application_time"], cache["json"]["@timestamp"]) where cache["application_time"]
        == nil and IsMap(cache["json"]) and IsString(cache["json"]["@timestamp"])
      - set(cache["application_time"], cache["json"]["time"]) where cache["application_time"]
        == nil and IsMap(cache["json"]) and IsString(cache["json"]["time"])
      - set(time, Time(cache["application_time"], "%Y-%m-%dT%H:%M:%S.%sZ")) where
        IsString(cache["application_time"]) and IsMatch(cache["application_time"],
        "Z$")
      - set(time, Time(cache["application_time"], "%Y-%m-%dT%H:%M:%S.%s%j")) where
        IsString(cache["application_time"]) and IsMatch(cache["application_time"],
        "[+-][0-9]{2}:[0-9]{2}$")
      - set(severity_text, cache["json"]["level"]) where IsMap(cache["json"]) and
        IsString(cache["json"]["level"])
      - set(severity_text, cache["json"]["levelname"]) where severity_text == "" and
        IsMap(cache["json"]) and IsString(cache["json"]["levelname"])
      - set(severity_text, ToUpperCase(severity_text)) where severity_text != ""
      - set(severity_number, 1) where severity_text == "TRACE"
      - set(severity_number, 5) where severity_text == "DEBUG"
      - set(severity_number, 9) where severity_text == "INFO"
      - set(severity_number, 13) where severity_text == "WARN"
      - set(severity_number, 13) where severity_text == "WARNING"
      - set(severity_number, 17) where severity_text == "ERROR"
      - set(severity_number, 21) where severity_text == "FATAL"
      - set(severity_number, 21) where severity_text == "CRITICAL"
      - set(severity_number, 1) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 10
      - set(severity_text, "TRACE") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 10
      - set(severity_number, 5) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 20
      - set(severity_text, "DEBUG") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 20
      - set(severity_number, 9) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 30
      - set(severity_text, "INFO") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 30
      - set(severity_number, 13) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 40
      - set(severity_text, "WARN") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 40
      - set(severity_number, 17) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 50
      - set(severity_text, "ERROR") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 50
      - set(severity_number, 21) where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 60
      - set(severity_text, "FATAL") where IsMap(cache["json"]) and (IsInt(cache["json"]["level"])
        or IsDouble(cache["json"]["level"])) and cache["json"]["level"] == 60
      - delete_key(cache["json"], "password") where IsMap(cache["json"])
      - delete_key(cache["json"], "authorization") where IsMap(cache["json"])
      - delete_key(cache["json"], "cookie") where IsMap(cache["json"])
      - set(body, cache["json"]) where IsMap(cache["json"])
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["k8s.namespace.name"] != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"])
        where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")
  application_time:
    enabled: false
    timezone: UTC
    layout: '%Y-%m-%d %H:%M:%S.%L'
resource_attributes: {}
trace_processing:
  drop_noise: false
  noise_filter:
    error_mode: ignore
    traces:
      span:
      - kind == SPAN_KIND_SERVER and status.code != STATUS_CODE_ERROR and (attributes["http.response.status_code"]
        == nil or attributes["http.response.status_code"] < 400) and (attributes["http.status_code"]
        == nil or attributes["http.status_code"] < 400) and (attributes["http.route"]
        == "/health" or attributes["http.route"] == "/healthz" or attributes["http.route"]
        == "/readyz" or attributes["http.route"] == "/livez" or attributes["http.route"]
        == "/actuator/health")
  redact:
    actions:
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: db.statement
      action: delete
    - key: db.query.text
      action: delete
    # 完整URL/旧版target可能含凭据或敏感查询；保留独立url.path/http.route用于定位。
    - key: url.full
      action: delete
    - key: url.query
      action: delete
    - key: url.fragment
      action: delete
    - key: http.url
      action: delete
    - key: http.target
      action: delete
    - key: http.request.body
      action: delete
    - key: http.response.body
      action: delete
  normalize:
    error_mode: ignore
    trace_statements:
    - context: resource
      statements:
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"]
        != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"])
        where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")
metrics_processing:
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.limit:
            enabled: true
      load: {}
      disk: {}
      network: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_mount_points:
          match_type: regexp
          mount_points:
          - /dev/.*
          - /proc/.*
          - /sys/.*
          - /var/lib/kubelet/.*
          - /run/containerd/.*
          - /run/k3s/containerd/.*
          - /var/lib/docker/.*
          - /snap/.*
        exclude_fs_types:
          match_type: strict
          fs_types:
          - autofs
          - binfmt_misc
          - bpf
          - cgroup
          - cgroup2
          - configfs
          - debugfs
          - devpts
          - devtmpfs
          - fusectl
          - hugetlbfs
          - iso9660
          - mqueue
          - nsfs
          - overlay
          - proc
          - procfs
          - pstore
          - rpc_pipefs
          - securityfs
          - selinuxfs
          - squashfs
          - sysfs
          - tracefs
  kubeletstats:
    auth_type: serviceAccount
    endpoint: https://${env:OTEL_NODE_IP}:10250
    collection_interval: 30s
    insecure_skip_verify: false
    metric_groups:
    - pod
    - container
    - volume
  cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - NetworkUnavailable
    allocatable_types_to_report:
    - cpu
    - memory
    - storage
  labels:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"]
        != nil
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"])
        where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"]
        != nil
      - delete_matching_keys(resource.attributes, "^obs[.](pod|namespace)[.]")
    - context: datapoint
      statements:
      - set(attributes["k8s_cluster_name"], resource.attributes["k8s.cluster.name"])
        where resource.attributes["k8s.cluster.name"] != nil and attributes["k8s_cluster_name"]
        == nil
      - set(attributes["deployment_environment_name"], resource.attributes["deployment.environment.name"])
        where resource.attributes["deployment.environment.name"] != nil and attributes["deployment_environment_name"]
        == nil
      - set(attributes["k8s_namespace_name"], resource.attributes["k8s.namespace.name"])
        where resource.attributes["k8s.namespace.name"] != nil and attributes["k8s_namespace_name"]
        == nil
      - set(attributes["k8s_pod_name"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"]
        != nil and attributes["k8s_pod_name"] == nil
      - set(attributes["k8s_node_name"], resource.attributes["k8s.node.name"]) where
        resource.attributes["k8s.node.name"] != nil and attributes["k8s_node_name"]
        == nil
      - set(attributes["service_name"], resource.attributes["service.name"]) where resource.attributes["service.name"]
        != nil and attributes["service_name"] == nil
      - set(attributes["service_namespace"], resource.attributes["service.namespace"])
        where resource.attributes["service.namespace"] != nil and attributes["service_namespace"]
        == nil
      - set(attributes["k8s_container_name"], resource.attributes["k8s.container.name"])
        where resource.attributes["k8s.container.name"] != nil and attributes["k8s_container_name"]
        == nil
      - set(attributes["k8s_volume_name"], resource.attributes["k8s.volume.name"]) where
        resource.attributes["k8s.volume.name"] != nil and attributes["k8s_volume_name"]
        == nil
      - set(attributes["k8s_daemonset_name"], resource.attributes["k8s.daemonset.name"])
        where resource.attributes["k8s.daemonset.name"] != nil and attributes["k8s_daemonset_name"]
        == nil
      - set(attributes["k8s_statefulset_name"], resource.attributes["k8s.statefulset.name"])
        where resource.attributes["k8s.statefulset.name"] != nil and attributes["k8s_statefulset_name"]
        == nil
      - set(attributes["k8s_replicaset_name"], resource.attributes["k8s.replicaset.name"])
        where resource.attributes["k8s.replicaset.name"] != nil and attributes["k8s_replicaset_name"]
        == nil
      - set(attributes["k8s_job_name"], resource.attributes["k8s.job.name"]) where resource.attributes["k8s.job.name"]
        != nil and attributes["k8s_job_name"] == nil
      - set(attributes["k8s_cronjob_name"], resource.attributes["k8s.cronjob.name"])
        where resource.attributes["k8s.cronjob.name"] != nil and attributes["k8s_cronjob_name"]
        == nil
      - set(attributes["k8s_hpa_name"], resource.attributes["k8s.hpa.name"]) where resource.attributes["k8s.hpa.name"]
        != nil and attributes["k8s_hpa_name"] == nil
trace_headers: {}
log_headers: {}
metrics_headers: {}
operator_metrics:
  enabled: true
  namespace: opentelemetry-operator-system
  service: otel-operator-opentelemetry-operator
  port: 8443
  server_name: otel-operator-opentelemetry-operator-webhook.opentelemetry-operator-system.svc
  certificate_secret: otel-operator-opentelemetry-operator-controller-manager-service-cert
kafka_metrics:
  enabled: false
  collection_interval: 30s
scheduling:
  gateway:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    priorityClassName: ''
  logs:
    nodeSelector:
      kubernetes.io/os: linux
