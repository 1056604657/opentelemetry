# 通用生产集群配置：所有公司、云平台和后端都使用这一份，不需要选择其他模板。
# [必填] 跨集群唯一的稳定名称。
cluster_name: REPLACE_ME

# [必填地址] 按实际写入接口填写；协议默认无需改。
trace_protocol: otlp_http    # 可选 otlp_http / otlp_grpc
trace_endpoint: https://traces.invalid:4318
log_protocol: otlp_http      # 可选 otlp_http / otlp_grpc
log_endpoint: https://logs.invalid:4318
metrics_protocol: otlp_http  # 可选 otlp_http / otlp_grpc / prometheus_remote_write
metrics_endpoint: https://metrics.invalid/api/v1/otlp
# HTTP 填 base URL，自动追加 /v1/<信号>；Remote Write 填完整 write URL。
# gRPC 填 host:port，不带 scheme；厂商完整 HTTP URL 的填法见架构文档“后端连接”。

# [按需] 完整 Authorization 值，例如 Bearer <token>；确认无认证才留空。
credentials:
  backends:
    TRACES_AUTHORIZATION: ''
    METRICS_AUTHORIZATION: ''
    LOGS_AUTHORIZATION: ''

# [无需修改] Chart 内置生产默认值、资源、副本、通用处理和采样规则。
# 默认无 PVC、日志直发；Kafka、增强诊断和 HPA 关闭。
# 私有 CA、私仓、Kafka 等参数按需写入本文件，见 01-架构文档.md；不用再叠加其他模板。
# 真实配置复制为 values-<集群名>.local.yaml 保存，不提交或分享凭据。
