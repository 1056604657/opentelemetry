# 通用生产集群配置：所有公司、云平台和后端都使用这一份，不需要选择其他模板。
#
# 用法：复制成本地文件后填写，文件名建议 values-<集群名>.local.yaml
#   cp values-platform.yaml values-prod-01.local.yaml
#
# 本文件只列常用项，**不是全量字段清单**。需要更多参数时直接在副本里手写，
# 字段名和默认值以 charts/otel-platform/values.yaml 为准（或查 values.schema.json）。
#
# 常见但本文件未列出的字段（默认值都是可用的，按需覆盖）：
#   environment: production            # 环境标识，进 deployment.environment.name
#   log_namespaces: [business-a]       # 只采这些命名空间的容器日志，空=全部
#   otlp_namespace_selector: {}        # 只接受这些命名空间的 OTLP 数据，空=不过滤
#   monitor_namespace_selector: {}     # 只发现这些命名空间里的 Monitor，空=不过滤
#   node_state_directory: /var/lib/otel-node   # Node Agent 的 hostPath 目录
#   backend_ca_file: ''                # 后端私有 CA 路径，配合 TLS 使用
#   exporter_batch_max_kib: 512        # 出口批大小上限
#   rollout_revision: ''               # 改了 Secret 内容后递增此值触发滚动
#   scheduling:                        # 各角色的 nodeSelector/tolerations
#     gateway: {nodeSelector: {kubernetes.io/os: linux}, tolerations: []}
#   businessPodMonitors: []            # 额外业务 PodMonitor
#   service_annotation_discovery:      # 按 Service annotation 抓指标
#     enabled: false
#     namespaces: []
#
# 采集范围收窄的三个开关要一致，否则会出现"日志采了但 OTLP 被拒"或反过来的情况：
#   log_namespaces / otlp_namespace_selector / monitor_namespace_selector

# [必填] 跨集群唯一的稳定名称。
cluster_name: REPLACE_ME

# [必填地址] 按实际写入接口填写；协议默认无需改。
trace_protocol: otlp_http    # 可选 otlp_http / otlp_grpc
trace_endpoint: https://traces.invalid:4318
log_protocol: otlp_http      # 可选 otlp_http / otlp_grpc
log_endpoint: https://logs.invalid:4318
metrics_protocol: otlp_http  # 可选 otlp_http / otlp_grpc / prometheus_remote_write
metrics_endpoint: https://metrics.invalid/api/v1/otlp
# HTTP 填 base URL，自动追加 /v1/<信号>；Remote Write 填完整 write URL。
# gRPC 填 host:port，不带 scheme；厂商完整 HTTP URL 的填法见架构文档“后端连接”。

# [按需] 完整 Authorization 值，例如 Bearer <token>；确认无认证才留空。
credentials:
  backends:
    TRACES_AUTHORIZATION: ''
    METRICS_AUTHORIZATION: ''
    LOGS_AUTHORIZATION: ''

# [无需修改] Chart 内置生产默认值、资源、副本、通用处理和采样规则。
# 默认无 PVC、日志直发；Kafka、增强诊断和 HPA 关闭。
# 私有 CA、私仓、Kafka 等参数按需写入本文件，见 01-架构文档.md；不用再叠加其他模板。
# 真实配置复制为 values-<集群名>.local.yaml 保存，不提交或分享凭据。

# [常用] 下列值与 Chart 默认值一致；修改前按实际流量和节点预算核算。
gateway_replicas: 2
scraper_replicas: 2
sampler_replicas: 3  # 变更会影响 traceID 分片，不能直接跟随 Gateway HPA。
filelog_max_log_size: 256KiB  # 同步控制读取、CRI 重组和应用多行合并。
filelog_start_at: beginning  # 首次发现会补读仍在磁盘的历史文件。
exporter_queue_mib: 256      # 每实例、每出口逻辑容量，不是整个 Pod 内存。
otlp_max_recv_mib: 4         # 必须容纳单条日志及至少 64KiB 元数据余量。
persistent_queue: false
storage_class: ''
pvc_size: 10Gi

# [按需] 后端只提供集群内 HTTP（无 TLS）时，显式打开对应信号，默认 false 要求 HTTPS。
# 只对确实没有 TLS 的信号打开，不要全局关闭校验。
# backend_http:
#   traces:  {allow_http: true}
#   logs:    {allow_http: true}
#   metrics: {allow_http: true}

# [按需] 镜像。默认全部来自 ghcr.io；访问不了公网或要求走内部仓库时，
# 把固定版本同步到自己的仓库后填完整地址（含 tag），核对 CPU 架构。
# 每个字段独立生效：填哪个换哪个，没填的沿用 chart 默认值，不必全部填齐。
#
# 注意 collector_image / target_allocator_image 以这里为准：
# 平台包会把它们显式写进 Collector CR 的 spec.image，
# 覆盖 values-operator.yaml 里同名项的兜底默认值。
# 换 Collector 或 TA 镜像改这里，改 values-operator.yaml 不生效。
# collector_image: registry.example.com/otel/collector-contrib:0.163.2
# target_allocator_image: registry.example.com/otel/target-allocator:0.161.0
# 探针镜像只有这里能配，Operator 侧没有对应字段。
# java_image: registry.example.com/otel/autoinstrumentation-java:2.32.0-1
# python_image: registry.example.com/otel/autoinstrumentation-python:0.66b1-2
# nodejs_image: registry.example.com/otel/autoinstrumentation-nodejs:0.78.0-6
# 私仓拉取凭据，需预先在 observability namespace 建好。
# image_pull_secrets:
#   - name: registry-pull

# [按需] 独立 requests/limits；未填写的字段继承 Chart 旧资源预算。
# memory limit 同步更新 memory_limiter/GOMEMLIMIT；request 必须 <= limit。
collector_resources: {}
# collector_resources:
#   gateway:
#     requests: {cpu: 500m, memory: 1Gi}
#     limits: {cpu: '2', memory: 4Gi}
# 其他角色：node / cluster / scraper / sampler。调度使用 scheduling.<角色>。

# [按需] 诊断覆盖：容器限流/内存/OOM/IO，API Server，KSM 对象状态，主机进程。
# 先复用现有 KSM；metric_names 白名单与进程 names/metrics 可在同一份文件覆盖。
diagnostics:
  cadvisor: {enabled: false}
  apiserver: {enabled: false}
  kube_state_metrics:
    enabled: false
    target: kube-state-metrics.observability.svc:8080
  host_process: {enabled: false}

# [按需] 需要已有 metrics.k8s.io；CPU 利用率以最终 request 为分母。
# 只自动扩容；关闭 HPA 或人工缩容前先排空队列。
autoscaling:
  gateway:
    enabled: false
    min_replicas: 2
    max_replicas: 5
    target_cpu_utilization: 70
