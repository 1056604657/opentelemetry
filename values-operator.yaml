# [固定安装预设] 直接用于 Operator 安装，无需复制或编辑。
# OpenTelemetry Operator：只管理控制器、Webhook 和注入能力。
# Collector 的 PVC 开关按需写入本集群 values，本文件无需配置存储。
# 私有镜像等环境差异另用覆盖文件；不要修改官方 Operator 安装包。
#
# 只有当默认镜像拉不到时才需要动本文件（先按部署文档 1.1 节实测）：
# 改下方 manager.image / collectorImage / targetAllocatorImage 的 repository
# 为可信仓库地址，保留原 tag，并在文件末尾加顶层 imagePullSecrets。

# 1. 控制器副本和维护保护
replicaCount: 1
pdb:
  create: false

# 2. 固定镜像版本、资源和自监控
manager:
  # Operator 自身镜像。只有这里能配，平台配置里没有对应项。
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
    tag: 0.161.0
  # 以下两项只是「Operator 创建 Collector CR 时的兜底默认」。
  # 本项目平台包会把自己 values 里的 collector_image / target_allocator_image
  # 显式写进每个 CR 的 spec.image，覆盖这里的值。
  # → 换镜像请改 values-platform.yaml；只改这里不生效。
  # 保留这两行是为了：平台包未显式指定时（如手工建 CR）仍有可用默认值。
  collectorImage:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.163.2
  targetAllocatorImage:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
    tag: 0.161.0
  # 当前禁用 Go 自动注入；Java/Python/Node.js 探针配置由平台 Instrumentation 提供。
  autoInstrumentation:
    go:
      enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  # 自监控通过 HTTPS 提供，使用 Webhook 服务证书。
  extraArgs:
    - --metrics-tls-cert-file=/tmp/k8s-webhook-server/serving-certs/tls.crt
    - --metrics-tls-key-file=/tmp/k8s-webhook-server/serving-certs/tls.key
  extraEnvs:
    - name: GOMEMLIMIT
      value: 384MiB

# 3. 注入失败策略和 Webhook 证书
# Ignore 允许 Webhook 故障时业务 Pod 继续启动，验收时必须确认探针实际注入。
# 自动签发证书无需 cert-manager；到期前按架构文档轮换。
admissionWebhooks:
  pods:
    failurePolicy: Ignore
  certManager:
    enabled: false
  autoGenerateCert:
    enabled: true
    recreate: false
    certPeriodDays: 365

# 4. 调度偏好（多副本时尽量分散到不同节点）
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-operator
